<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --background-dark: #000000;
            --text-light: #ffffff;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0; /* Removes default margin */
            padding: 0; /* Removes default padding */
            background-color: var(--background-dark); /* Sets background to black */
            color: var(--text-light); /* Sets text to white */
            min-height: 100vh; /* Ensures page fills entire viewport height */
        }

        /* Hide the header in presentation mode */
        .hero {
            display: none; /* Hides the hero section completely */
        }

        .container {
            max-width: 100%;  /* Makes container full width */
            margin: 0; /* Removes margin */
            padding: 1rem; /* Adds small padding all around */
        }

        /* Base styling for transcript container */
        .transcript-container {
            height: 90vh;  /* Sets height to 90% of viewport height */
            border: none; /* Removes border */
            padding: 2rem; /* Adds generous padding inside */
            background: var(--background-dark); /* Ensures background is black */
            color: var(--text-light); /* Ensures text is white */
            overflow-y: auto; /* Enables vertical scrolling when content overflows */
            margin-bottom: 0; /* Removes bottom margin */
            display: block; /* Makes element a block to take full width */
            width: 100%; /* Sets width to 100% */
        }

        /* Styling for transcript paragraphs */
        .transcript-container p {
            margin: 0.5rem 0; /* Small vertical margin between paragraphs */
            padding: 0.5rem 0; /* Small vertical padding within paragraphs */
            background: transparent; /* Transparent background (no highlighting) */
            border-radius: 0; /* No rounded corners */
            line-height: 1.6; /* Increases line spacing for readability */
            font-size: 10rem;  /* rem means relative to the root font size */
            font-weight: 500; /* 500 = medium weight, 700 = bold */
            max-width: 98%; /* Full width within container */
            white-space: normal;  /* Allows text to wrap normally */
            word-wrap: break-word; /* Prevents overflow of long words */
            color: white; /* Explicitly sets text color to white */
            display: block; /* Each paragraph takes full width */
        }

        /* Current paragraph styling - slightly brighter for emphasis */
        .transcript-container p.current {
            background: transparent;  /* No background color */
            color: rgba(255, 255, 255, 1.0); /* Full brightness white for current text */
        }

        /* Ensure all paragraphs have full opacity (keeps history visible) */
        .transcript-container p:nth-last-child(n+4) {
            opacity: 1.0; /* Shows all paragraphs at full opacity */
        }

        /* Controls for starting/stopping transcription */
        .controls {
            position: fixed; /* Fixes controls to viewport */
            bottom: 2rem; /* Positions 2rem from bottom */
            right: 2rem; /* Positions 2rem from right */
            margin: 0; /* No margin */
            opacity: 0.8;  /* Slightly transparent when not hovered */
            transition: opacity 0.3s ease; /* Smooth transition for opacity changes */
            z-index: 1000; /* Ensures controls appear above other elements */
        }

        .controls:hover {
            opacity: 1; /* Full opacity on hover */
        }

        /* Button styling - orange with black text for good contrast */
        button {
            background: #34d399 ; /* Solid orange background */
            backdrop-filter: blur(5px); /* Blur effect for elements behind */
            font-size: 1.2rem; /* Large text */
            min-width: 160px; /* Minimum width for button */
            padding: 15px 30px; /* Generous padding inside button */
            color: black !important;  /* Forces black text color */
            font-weight: bold; /* Bold text for better visibility */
            border: 2px solid rgba(255, 255, 255, 0.2); /* Subtle border */
            border-radius: 8px; /* Rounded corners */
            cursor: pointer; /* Shows pointer cursor on hover */
            transition: all 0.2s ease; /* Smooth transition for hover effects */
            display: block; /* Makes button take up full width */
        }

        button:hover {
            background: rgba(249, 164, 92, 0.9); /* Slightly more transparent on hover */
            transform: translateY(-2px); /* Slight upward movement on hover */
        }

        /* Spinner animation for loading state */
        .icon-with-spinner .spinner {
            border: 3px solid black; /* Spinner border */
            border-top: 3px solid transparent; /* Transparent top creates spinning effect */
            border-radius: 50%; /* Makes it circular */
            width: 24px; /* Width of spinner */
            height: 24px; /* Height of spinner */
            animation: spin 1s linear infinite; /* Animation for spinning effect */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); } /* Starting rotation */
            100% { transform: rotate(360deg); } /* Full 360° rotation */
        }

        /* Recording indicator pulse animation */
        .pulse-circle {
            display: inline-block; /* Allows other elements inline */
            width: 12px; /* Width of pulse circle */
            height: 12px; /* Height of pulse circle */
            border-radius: 50%; /* Makes it circular */
            background-color: red; /* Red color for recording indicator */
            margin-right: 8px; /* Space to right of circle */
            animation: pulse 1.5s ease infinite; /* Continuous pulsing animation */
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; } /* Slightly smaller and transparent */
            50% { transform: scale(1.1); opacity: 1; } /* Larger and fully opaque */
            100% { transform: scale(0.95); opacity: 0.7; } /* Back to starting state */
        }

        /* Custom scrollbar styling */
        .transcript-container::-webkit-scrollbar {
            width: 8px; /* Width of scrollbar */
        }

        .transcript-container::-webkit-scrollbar-track {
            background: var(--background-dark); /* Black scrollbar track */
        }

        .transcript-container::-webkit-scrollbar-thumb {
            background: rgba(249, 164, 92, 0.3); /* Semi-transparent orange scrollbar thumb */
            border-radius: 4px; /* Rounded corners on scrollbar thumb */
        }

        /* Error toast styling */
        .toast {
            background: rgba(0, 0, 0, 0.8); /* Semi-transparent black background */
            backdrop-filter: blur(5px); /* Blur effect behind toast */
            color: var(--text-light); /* White text */
            font-size: 1.2rem; /* Large text size */
        }

        /* Snow Effect */
        /* .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;

        .flake {
            position: absolute;
            border-radius: 50%;
            animation: flakes linear infinite;
        }

        @keyframes flakes {
            0% {
                transform: translateY(-100px) rotateX(0deg) rotateY(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) rotateX(360deg) rotateY(180deg);
                opacity: 0;
            }
        }

        /* Generate colorful snowflakes with different sizes, positions, speeds, and colors */
        .flake:nth-child(1) { left: 10%; width: 8px; height: 8px; animation-duration: 12s; animation-delay: -2s; background: radial-gradient(circle, rgba(255,182,193,0.8) 0%, rgba(255,182,193,0.4) 50%, transparent 100%); }
        .flake:nth-child(2) { left: 20%; width: 12px; height: 12px; animation-duration: 8s; animation-delay: -5s; background: radial-gradient(circle, rgba(173,216,230,0.8) 0%, rgba(173,216,230,0.4) 50%, transparent 100%); }
        .flake:nth-child(3) { left: 30%; width: 6px; height: 6px; animation-duration: 15s; animation-delay: -1s; background: radial-gradient(circle, rgba(255,255,224,0.8) 0%, rgba(255,255,224,0.4) 50%, transparent 100%); }
        .flake:nth-child(4) { left: 40%; width: 10px; height: 10px; animation-duration: 10s; animation-delay: -3s; background: radial-gradient(circle, rgba(221,160,221,0.8) 0%, rgba(221,160,221,0.4) 50%, transparent 100%); }
        .flake:nth-child(5) { left: 50%; width: 14px; height: 14px; animation-duration: 9s; animation-delay: -6s; background: radial-gradient(circle, rgba(152,251,152,0.8) 0%, rgba(152,251,152,0.4) 50%, transparent 100%); }
        .flake:nth-child(6) { left: 60%; width: 7px; height: 7px; animation-duration: 13s; animation-delay: -4s; background: radial-gradient(circle, rgba(255,218,185,0.8) 0%, rgba(255,218,185,0.4) 50%, transparent 100%); }
        .flake:nth-child(7) { left: 70%; width: 11px; height: 11px; animation-duration: 11s; animation-delay: -7s; background: radial-gradient(circle, rgba(255,192,203,0.8) 0%, rgba(255,192,203,0.4) 50%, transparent 100%); }
        .flake:nth-child(8) { left: 80%; width: 9px; height: 9px; animation-duration: 14s; animation-delay: -2s; background: radial-gradient(circle, rgba(176,224,230,0.8) 0%, rgba(176,224,230,0.4) 50%, transparent 100%); }
        .flake:nth-child(9) { left: 90%; width: 13px; height: 13px; animation-duration: 7s; animation-delay: -8s; background: radial-gradient(circle, rgba(255,160,122,0.8) 0%, rgba(255,160,122,0.4) 50%, transparent 100%); }
        .flake:nth-child(10) { left: 15%; width: 8px; height: 8px; animation-duration: 12s; animation-delay: -1s; background: radial-gradient(circle, rgba(230,230,250,0.8) 0%, rgba(230,230,250,0.4) 50%, transparent 100%); }
        .flake:nth-child(11) { left: 25%; width: 6px; height: 6px; animation-duration: 16s; animation-delay: -5s; background: radial-gradient(circle, rgba(255,105,180,0.8) 0%, rgba(255,105,180,0.4) 50%, transparent 100%); }
        .flake:nth-child(12) { left: 35%; width: 10px; height: 10px; animation-duration: 9s; animation-delay: -3s; background: radial-gradient(circle, rgba(135,206,250,0.8) 0%, rgba(135,206,250,0.4) 50%, transparent 100%); }
        .flake:nth-child(13) { left: 45%; width: 12px; height: 12px; animation-duration: 11s; animation-delay: -6s; background: radial-gradient(circle, rgba(255,228,181,0.8) 0%, rgba(255,228,181,0.4) 50%, transparent 100%); }
        .flake:nth-child(14) { left: 55%; width: 7px; height: 7px; animation-duration: 13s; animation-delay: -2s; background: radial-gradient(circle, rgba(186,85,211,0.8) 0%, rgba(186,85,211,0.4) 50%, transparent 100%); }
        .flake:nth-child(15) { left: 65%; width: 9px; height: 9px; animation-duration: 8s; animation-delay: -4s; background: radial-gradient(circle, rgba(144,238,144,0.8) 0%, rgba(144,238,144,0.4) 50%, transparent 100%); }
        .flake:nth-child(16) { left: 75%; width: 11px; height: 11px; animation-duration: 10s; animation-delay: -7s; background: radial-gradient(circle, rgba(255,239,213,0.8) 0%, rgba(255,239,213,0.4) 50%, transparent 100%); }
        .flake:nth-child(17) { left: 85%; width: 14px; height: 14px; animation-duration: 15s; animation-delay: -1s; background: radial-gradient(circle, rgba(255,20,147,0.8) 0%, rgba(255,20,147,0.4) 50%, transparent 100%); }
        .flake:nth-child(18) { left: 95%; width: 8px; height: 8px; animation-duration: 12s; animation-delay: -5s; background: radial-gradient(circle, rgba(175,238,238,0.8) 0%, rgba(175,238,238,0.4) 50%, transparent 100%); }
        .flake:nth-child(19) { left: 5%; width: 10px; height: 10px; animation-duration: 9s; animation-delay: -3s; background: radial-gradient(circle, rgba(255,250,205,0.8) 0%, rgba(255,250,205,0.4) 50%, transparent 100%); }
        .flake:nth-child(20) { left: 22%; width: 6px; height: 6px; animation-duration: 14s; animation-delay: -8s; background: radial-gradient(circle, rgba(218,112,214,0.8) 0%, rgba(218,112,214,0.4) 50%, transparent 100%); }

        /* Ocean Wave Effect */
        #ocean {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20vh;
            min-height: 120px;
            max-height: 200px;
            background: linear-gradient(to top, rgba(16, 185, 129, 0.3), rgba(5, 150, 105, 0.1));
            pointer-events: none;
            z-index: 500;
        }

        .wave {
            background: rgba(16, 185, 129, 0.6);
            display: inline-block;
            height: 60%;
            width: 10px;
            position: absolute;
            bottom: 0;
            animation: dostuff 6s infinite ease-in-out;
        }

        @keyframes dostuff {
            0% {
                height: 60%;
            }
            50% { 
                height: 40%;
            }
            100% { 
                height: 60%;
            }
        }

    </style>

    <!-- Ocean wave effect -->
    <div id="ocean"></div>
    <!-- Error message container that slides in when needed -->
    <div id="error-toast" class="toast"></div>
    <!-- Header section (hidden in presentation mode) -->
    <div class="hero">
        <h1>DM AI Agent</h1>
        <p>Powered by <a href="https://www.linkedin.com/in/daniel-mamre-8bb169168/" target="_blank" style="color: #10b981; text-decoration: none;">Daniel Mamre</a> 🤖</p>

    <!-- Main content container -->
    <div class="container">
        <!-- Container for transcript text -->
        <div class="transcript-container" id="transcript"></div>
        <!-- Controls for starting/stopping recording -->
        <div class="controls">
            <button id="start-button">Start Recording</button>
        </div>
    </div>

    <script src="/static/client.js"></script>
    <script>
        // Create ocean waves
        var ocean = document.getElementById("ocean"),
            waveWidth = 10,
            waveCount = Math.floor(window.innerWidth/waveWidth),
            docFrag = document.createDocumentFragment();

        for(var i = 0; i < waveCount; i++){
            var wave = document.createElement("div");
            wave.className += " wave";
            docFrag.appendChild(wave);
            wave.style.left = i * waveWidth + "px";
            wave.style.animationDelay = (i/100) + "s";
        }

        ocean.appendChild(docFrag);

        // Recreate waves on window resize
        window.addEventListener('resize', function() {
            ocean.innerHTML = '';
            waveCount = Math.floor(window.innerWidth/waveWidth);
            docFrag = document.createDocumentFragment();
            
            for(var i = 0; i < waveCount; i++){
                var wave = document.createElement("div");
                wave.className += " wave";
                docFrag.appendChild(wave);
                wave.style.left = i * waveWidth + "px";
                wave.style.animationDelay = (i/100) + "s";
            }
            
            ocean.appendChild(docFrag);
        });
    </script>
