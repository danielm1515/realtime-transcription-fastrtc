<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM AI Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        window.__RTC_CONFIGURATION__ = __INJECTED_RTC_CONFIG__;
    </script>
    <style>
        :root {
            /* --primary-gradient: linear-gradient(135deg, #20976f30 0%, #2d2d2d 100%); */
            /* --primary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%); */
            --background-dark: #1a1a1a;
            --background-secondary: #2d2d2d;
            --text-light: #f5f5f5;
            --text-secondary: #a1a1aa;
            --pulse-primary: #10b981;
            --pulse-secondary: #059669;
            --pulse-accent: #34d399;
            --border-color: #404040;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-dark);
            color: var(--text-light);
            min-height: 100vh;
        }

        .hero {
            background: var(--primary-gradient);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .hero p {
            font-size: 1rem;
            margin-top: 0.5rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: 1.5rem auto;
            padding: 0 2rem;
        }

        .transcript-container {
            border-radius: 12px;
            background-color: var(--background-secondary);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .controls {
            text-align: center;
            margin: 1.5rem 0;
        }

        button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            min-width: 180px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(230, 100, 101, 0.15);
        }

        button:active {
            transform: translateY(0);
        }

        /* Transcript text styling */
        .transcript-container p {
            margin: 0.4rem 0;
            padding: 0.6rem;
            background: var(--background-dark);
            border-radius: 8px;
            line-height: 1.4;
            font-size: 0.95rem;
            color: var(--text-light);
        }

        /* Custom scrollbar - made thinner */
        .transcript-container::-webkit-scrollbar {
            width: 6px;
        }

        .transcript-container::-webkit-scrollbar-track {
            background: var(--background-dark);
            border-radius: 3px;
        }

        .transcript-container::-webkit-scrollbar-thumb {
            background: var(--pulse-primary);
            border-radius: 3px;
            opacity: 0.8;
        }

        .transcript-container::-webkit-scrollbar-thumb:hover {
            background: var(--pulse-secondary);
        }

        /* Add styles for toast notifications */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 24px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 1000;
            display: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .toast.error {
            background-color: #f44336;
            color: white;
        }

        .toast.warning {
            background-color: #34d399;
            color: white;
        }

        /* Add styles for audio visualization */
        .icon-with-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-width: 180px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            flex-shrink: 0;
        }

        .pulse-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-width: 180px;
        }

        .pulse-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: white;
            opacity: 0.2;
            flex-shrink: 0;
            transform: translateX(-0%) scale(var(--audio-level, 1));
            transition: transform 0.1s ease;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ElevenLabs-style pulse container */
        .pulse-container-main {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2rem 0;
            position: relative;
        }

        .pulse {
            --audio-level: 1;
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            transform: scale(var(--audio-level));
            transition: all 0.3s ease-out;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            overflow: hidden;
        }

        /* ElevenLabs-style conic gradient background */
        .pulse::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(
                from 180deg,
                rgb(61, 117, 216) 11.5931deg,
                rgb(42, 104, 210) 26.317deg,
                rgb(117, 190, 229) 32.3924deg,
                rgb(82, 208, 233) 38.9146deg,
                rgb(33, 89, 186) 75.3508deg,
                rgb(58, 116, 218) 85.0388deg,
                rgb(108, 215, 236) 94.5293deg,
                rgb(90, 185, 241) 122.11deg,
                rgb(51, 161, 229) 129.967deg,
                rgb(31, 95, 207) 136.719deg,
                rgb(44, 84, 202) 144.313deg,
                rgb(58, 158, 207) 175.985deg,
                rgb(49, 103, 197) 183.869deg,
                rgb(173, 232, 243) 201.635deg,
                rgb(216, 241, 245) 224.865deg,
                rgb(165, 219, 230) 239.729deg,
                rgb(43, 157, 214) 268.165deg,
                rgb(174, 224, 233) 286.211deg,
                rgb(32, 186, 208) 329.654deg,
                rgb(30, 83, 176) 343.551deg,
                rgb(47, 64, 210) 359.255deg
            );
            z-index: 1;
        }

        /* Inner shadow layer */
        .pulse::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(
                circle at center,
                rgba(22, 225, 255, 0.02) 0%,
                rgba(22, 225, 255, 0.05) 50%,
                transparent 100%
            );
            box-shadow: 
                inset 0 29px 58px rgba(140, 255, 255, 0.3),
                inset 0 -17px 23px rgba(39, 69, 191, 0.4);
            z-index: 2;
        }

        .pulse:hover {
            transform: scale(1.05);
        }


        /* Soft pulse rings */
        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 1px solid rgba(61, 117, 216, 0.3);
            transform: translate(-50%, -50%);
            animation: soft-pulse 3s ease-in-out infinite;
        }

        .pulse-ring:nth-child(1) {
            width: 120px;
            height: 120px;
            animation-delay: 0s;
        }

        .pulse-ring:nth-child(2) {
            width: 140px;
            height: 140px;
            animation-delay: 1s;
        }

        .pulse-ring:nth-child(3) {
            width: 160px;
            height: 160px;
            animation-delay: 2s;
        }

        .pulse-ring:nth-child(4) {
            width: 180px;
            height: 180px;
            animation-delay: 3s;
        }

        @keyframes soft-pulse {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            20% {
                opacity: 0.3;
            }
            40% {
                opacity: 0.15;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.6);
            }
        }

        /* Audio reactive scaling for rings */
        .pulse-ring.active {
            border-color: rgba(82, 208, 233, 0.5);
            animation-duration: 2.5s;
            animation-name: active-pulse-ring;
        }

        @keyframes active-pulse-ring {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
                border-color: rgba(82, 208, 233, 0.8);
            }
            25% {
                opacity: 0.6;
                border-color: rgba(117, 190, 229, 0.6);
            }
            50% {
                opacity: 0.4;
                border-color: rgba(173, 232, 243, 0.4);
            }
            75% {
                opacity: 0.2;
                border-color: rgba(216, 241, 245, 0.3);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.8);
                border-color: rgba(82, 208, 233, 0);
            }
        }

        /* Subtle glow effect when recording */
        .pulse.recording {
            box-shadow: 
                0 0 20px rgba(61, 117, 216, 0.4),
                0 0 40px rgba(82, 208, 233, 0.3),
                0 0 60px rgba(117, 190, 229, 0.2);
        }

        /* Different glow effect when TTS is playing */
        .pulse.tts-playing {
            box-shadow: 
                0 0 25px rgba(16, 185, 129, 0.5),
                0 0 45px rgba(5, 150, 105, 0.4),
                0 0 65px rgba(34, 197, 94, 0.3);
        }

        /* Simple random color animation for idle state */
        @keyframes idle-color-shift {
            0% { filter: hue-rotate(0deg); }
            25% { filter: hue-rotate(90deg); }
            50% { filter: hue-rotate(180deg); }
            75% { filter: hue-rotate(270deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* Faster color changes when recording */
        @keyframes active-color-shift {
            0% { filter: hue-rotate(0deg) brightness(1) saturate(1.2); }
            20% { filter: hue-rotate(72deg) brightness(1.1) saturate(1.3); }
            40% { filter: hue-rotate(144deg) brightness(1.2) saturate(1.4); }
            60% { filter: hue-rotate(216deg) brightness(1.1) saturate(1.3); }
            80% { filter: hue-rotate(288deg) brightness(1.05) saturate(1.2); }
            100% { filter: hue-rotate(360deg) brightness(1) saturate(1.2); }
        }

        /* Default idle state - slow color changes */
        .pulse::before {
            animation: idle-color-shift var(--color-speed, 8s) linear infinite;
        }

        /* When recording - faster color changes */
        .pulse.recording::before {
            animation: active-color-shift var(--color-speed, 2s) linear infinite;
        }

        /* Status text below pulse */
        .pulse-status {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .pulse-status.recording {
            color: var(--pulse-primary);
        }

        /* Improve container spacing */
        .pulse-container-main {
            padding: 1rem 0;
        }

        /* Add subtle dark background pattern */
        body {
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(16, 185, 129, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(5, 150, 105, 0.02) 0%, transparent 50%);
        }

        /* Snow Effect */
        /* .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        } */

        .flake {
            position: absolute;
            border-radius: 50%;
            animation: flakes linear infinite;
        }

        @keyframes flakes {
            0% {
                transform: translateY(-100px) rotateX(0deg) rotateY(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) rotateX(360deg) rotateY(180deg);
                opacity: 0;
            }
        }

        /* Generate colorful snowflakes with different sizes, positions, speeds, and colors */
        .flake:nth-child(1) { left: 10%; width: 8px; height: 8px; animation-duration: 12s; animation-delay: -2s; background: radial-gradient(circle, rgba(255,182,193,0.8) 0%, rgba(255,182,193,0.4) 50%, transparent 100%); }
        .flake:nth-child(2) { left: 20%; width: 12px; height: 12px; animation-duration: 8s; animation-delay: -5s; background: radial-gradient(circle, rgba(173,216,230,0.8) 0%, rgba(173,216,230,0.4) 50%, transparent 100%); }
        .flake:nth-child(3) { left: 30%; width: 6px; height: 6px; animation-duration: 15s; animation-delay: -1s; background: radial-gradient(circle, rgba(255,255,224,0.8) 0%, rgba(255,255,224,0.4) 50%, transparent 100%); }
        .flake:nth-child(4) { left: 40%; width: 10px; height: 10px; animation-duration: 10s; animation-delay: -3s; background: radial-gradient(circle, rgba(221,160,221,0.8) 0%, rgba(221,160,221,0.4) 50%, transparent 100%); }
        .flake:nth-child(5) { left: 50%; width: 14px; height: 14px; animation-duration: 9s; animation-delay: -6s; background: radial-gradient(circle, rgba(152,251,152,0.8) 0%, rgba(152,251,152,0.4) 50%, transparent 100%); }
        .flake:nth-child(6) { left: 60%; width: 7px; height: 7px; animation-duration: 13s; animation-delay: -4s; background: radial-gradient(circle, rgba(255,218,185,0.8) 0%, rgba(255,218,185,0.4) 50%, transparent 100%); }
        .flake:nth-child(7) { left: 70%; width: 11px; height: 11px; animation-duration: 11s; animation-delay: -7s; background: radial-gradient(circle, rgba(255,192,203,0.8) 0%, rgba(255,192,203,0.4) 50%, transparent 100%); }
        .flake:nth-child(8) { left: 80%; width: 9px; height: 9px; animation-duration: 14s; animation-delay: -2s; background: radial-gradient(circle, rgba(176,224,230,0.8) 0%, rgba(176,224,230,0.4) 50%, transparent 100%); }
        .flake:nth-child(9) { left: 90%; width: 13px; height: 13px; animation-duration: 7s; animation-delay: -8s; background: radial-gradient(circle, rgba(255,160,122,0.8) 0%, rgba(255,160,122,0.4) 50%, transparent 100%); }
        .flake:nth-child(10) { left: 15%; width: 8px; height: 8px; animation-duration: 12s; animation-delay: -1s; background: radial-gradient(circle, rgba(230,230,250,0.8) 0%, rgba(230,230,250,0.4) 50%, transparent 100%); }
        .flake:nth-child(11) { left: 25%; width: 6px; height: 6px; animation-duration: 16s; animation-delay: -5s; background: radial-gradient(circle, rgba(255,105,180,0.8) 0%, rgba(255,105,180,0.4) 50%, transparent 100%); }
        .flake:nth-child(12) { left: 35%; width: 10px; height: 10px; animation-duration: 9s; animation-delay: -3s; background: radial-gradient(circle, rgba(135,206,250,0.8) 0%, rgba(135,206,250,0.4) 50%, transparent 100%); }
        .flake:nth-child(13) { left: 45%; width: 12px; height: 12px; animation-duration: 11s; animation-delay: -6s; background: radial-gradient(circle, rgba(255,228,181,0.8) 0%, rgba(255,228,181,0.4) 50%, transparent 100%); }
        .flake:nth-child(14) { left: 55%; width: 7px; height: 7px; animation-duration: 13s; animation-delay: -2s; background: radial-gradient(circle, rgba(186,85,211,0.8) 0%, rgba(186,85,211,0.4) 50%, transparent 100%); }
        .flake:nth-child(15) { left: 65%; width: 9px; height: 9px; animation-duration: 8s; animation-delay: -4s; background: radial-gradient(circle, rgba(144,238,144,0.8) 0%, rgba(144,238,144,0.4) 50%, transparent 100%); }
        .flake:nth-child(16) { left: 75%; width: 11px; height: 11px; animation-duration: 10s; animation-delay: -7s; background: radial-gradient(circle, rgba(255,239,213,0.8) 0%, rgba(255,239,213,0.4) 50%, transparent 100%); }
        .flake:nth-child(17) { left: 85%; width: 14px; height: 14px; animation-duration: 15s; animation-delay: -1s; background: radial-gradient(circle, rgba(255,20,147,0.8) 0%, rgba(255,20,147,0.4) 50%, transparent 100%); }
        .flake:nth-child(18) { left: 95%; width: 8px; height: 8px; animation-duration: 12s; animation-delay: -5s; background: radial-gradient(circle, rgba(175,238,238,0.8) 0%, rgba(175,238,238,0.4) 50%, transparent 100%); }
        .flake:nth-child(19) { left: 5%; width: 10px; height: 10px; animation-duration: 9s; animation-delay: -3s; background: radial-gradient(circle, rgba(255,250,205,0.8) 0%, rgba(255,250,205,0.4) 50%, transparent 100%); }
        .flake:nth-child(20) { left: 22%; width: 6px; height: 6px; animation-duration: 14s; animation-delay: -8s; background: radial-gradient(circle, rgba(218,112,214,0.8) 0%, rgba(218,112,214,0.4) 50%, transparent 100%); }

        /* Ocean Wave Effect */
        #ocean {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20vh;
            min-height: 120px;
            max-height: 200px;
            /* background: linear-gradient(to top, rgba(16, 185, 129, 0.3), rgba(5, 150, 105, 0.1)); */
            pointer-events: none;
            z-index: 500;
        }

        .wave {
            background: rgba(16, 185, 129, 0.6);
            display: inline-block;
            height: 60%;
            width: 10px;
            position: absolute;
            bottom: 0;
            animation: dostuff 6s infinite ease-in-out;
        }

        @keyframes dostuff {
            0% {
                height: 60%;
            }
            50% { 
                height: 40%;
            }
            100% { 
                height: 60%;
            }
        }

    </style>
</head>

<body>
    <!-- Snow effect -->
    <div class="snow">
        <div class="flake"></div>
        <div class="flake"></div>
        <div class="flake"></div>
        <div class="flake"></div>
        <div class="flake"></div>
        <div class="flake"></div>

        <div class="flake"></div>
        <div class="flake"></div>
    </div>
    <!-- Ocean wave effect -->
    <div id="ocean"></div>
    <!-- Add toast element after body opening tag -->
    <div id="error-toast" class="toast"></div>
    <div class="hero">
        <h1>DM AI Agent</h1>
        <p>Powered by <a href="https://www.linkedin.com/in/daniel-mamre-8bb169168/" target="_blank" style="color: #1c4b3b; text-decoration: none;">Daniel Mamre</a> 🤖</p>
    </div>

    <div class="container">
        <div class="pulse-container-main">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="pulse" id="pulse-button"></div>
        </div>
        <div class="pulse-status" id="pulse-status">Click to start recording</div>
        <div class="transcript-container" id="transcript"></div>
        <div class="controls">
            <button id="start-button">Start Recording</button>
        </div>
    </div>

    <script src="/static/client.js"></script>
    <script>
        // Create ocean waves
        var ocean = document.getElementById("ocean"),
            waveWidth = 10,
            waveCount = Math.floor(window.innerWidth/waveWidth),
            docFrag = document.createDocumentFragment();

        for(var i = 0; i < waveCount; i++){
            var wave = document.createElement("div");
            wave.className += " wave";
            docFrag.appendChild(wave);
            wave.style.left = i * waveWidth + "px";
            wave.style.animationDelay = (i/100) + "s";
        }

        ocean.appendChild(docFrag);

        // Recreate waves on window resize
        window.addEventListener('resize', function() {
            ocean.innerHTML = '';
            waveCount = Math.floor(window.innerWidth/waveWidth);
            docFrag = document.createDocumentFragment();
            
            for(var i = 0; i < waveCount; i++){
                var wave = document.createElement("div");
                wave.className += " wave";
                docFrag.appendChild(wave);
                wave.style.left = i * waveWidth + "px";
                wave.style.animationDelay = (i/100) + "s";
            }
            
            ocean.appendChild(docFrag);
        });
    </script>
</body>
